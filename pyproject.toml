[project]
name = "site"
version = "0.1.0"
description = "site"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "lru-dict>=1.4.1",
    "sentry-sdk[fastapi]>=2.54.0",
    "tzdata>=2025.3",
    "uvicorn>=0.41.0",
]

[tool.ruff]
line-length = 200

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "cr-lf"
preview = true

[tool.ruff.lint]
preview = true
ignore = ["F401", "F403", "F405"]