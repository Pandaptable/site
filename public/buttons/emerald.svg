<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <title>Chromatic Emerald Button</title>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="btn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d08"/>
      <stop offset="0.55" stop-color="#0c120d"/>
      <stop offset="1" stop-color="#131914"/>
    </linearGradient>
    <!-- Gem glow -->
    <radialGradient id="btn-glow" gradientUnits="userSpaceOnUse" cx="18" cy="15" r="16">
      <stop offset="0" stop-color="#2ecc71" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#2ecc71" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <!-- Gem shine -->
    <linearGradient id="btn-shine" gradientUnits="userSpaceOnUse" x1="10" y1="6" x2="20" y2="16">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Border gradient -->
    <linearGradient id="btn-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4de88a" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#1a6b3c" stop-opacity="0.60"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="88" height="31" rx="3" ry="3" fill="url(#btn-bg)"/>

  <!-- Subtle glow wash -->
  <rect width="88" height="31" rx="3" ry="3" fill="url(#btn-glow)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="87" height="30" rx="2.5" ry="2.5"
        fill="none" stroke="url(#btn-border)" stroke-width="1"/>

  <!-- ── Gem ────────────────────────────────────────────────────────── -->
  <polygon points="10,9 26,9 29,13 18,24 7,13"
           fill="#2ecc71" opacity="0.45"
           style="filter:blur(3px)"/>
  <g stroke="#abf0bc" stroke-opacity="0.45" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="10,9 26,9 24,13 12,13" fill="#abf0bc"/>
    <polygon points="10,9 12,13  7,13"      fill="#77e298"/>
    <polygon points="26,9 29,13 24,13"      fill="#77e298"/>
    <polygon points=" 7,13 12,13 18,24"     fill="#00984d"/>
    <polygon points="12,13 24,13 18,24"     fill="#27ae60"/>
    <polygon points="24,13 29,13 18,24"     fill="#007b3d"/>
  </g>
  <polygon points="10,9 26,9 24,13 12,13" fill="url(#btn-shine)"/>

  <!-- ── Sparkle stars ──────────────────────────────────────────────── -->
  <g fill="#abf0bc" opacity="0.80">
    <path d="M5,5 L5.7,7.3 L8,8 L5.7,8.7 L5,11 L4.3,8.7 L2,8 L4.3,7.3 Z"/>
    <path d="M32,7 L32.4,8.6 L34,9 L32.4,9.4 L32,11 L31.6,9.4 L30,9 L31.6,8.6 Z"/>
  </g>

  <!-- ── Pixel-art label "EMERALD" ─────────────────────────────────── -->
  <!--
    E,R,A,L,D : 4-wide (cols 0-3, step=7px)
    M          : 5-wide (cols 0-4, step=8.5px)
    dot size   : 1.5px × 1.5px   startY=12
    layout: E@34  M@41  E@49.5  R@56.5  A@63.5  L@70.5  D@77.5
  -->
  <g fill="#abf0bc" shape-rendering="crispEdges">

    <!-- E  (startX=34)
         ████
         █
         ███
         █
         ████ -->
    <rect x="34"   y="12"   width="1.5" height="1.5"/><rect x="35.5" y="12"   width="1.5" height="1.5"/><rect x="37"   y="12"   width="1.5" height="1.5"/><rect x="38.5" y="12"   width="1.5" height="1.5"/>
    <rect x="34"   y="13.5" width="1.5" height="1.5"/>
    <rect x="34"   y="15"   width="1.5" height="1.5"/><rect x="35.5" y="15"   width="1.5" height="1.5"/><rect x="37"   y="15"   width="1.5" height="1.5"/>
    <rect x="34"   y="16.5" width="1.5" height="1.5"/>
    <rect x="34"   y="18"   width="1.5" height="1.5"/><rect x="35.5" y="18"   width="1.5" height="1.5"/><rect x="37"   y="18"   width="1.5" height="1.5"/><rect x="38.5" y="18"   width="1.5" height="1.5"/>

    <!-- M  (startX=41, 5 cols wide)
         █   █
         ██ ██
         █ █ █
         █   █
         █   █ -->
    <rect x="41"   y="12"   width="1.5" height="1.5"/>                                                          <rect x="47"   y="12"   width="1.5" height="1.5"/>
    <rect x="41"   y="13.5" width="1.5" height="1.5"/><rect x="42.5" y="13.5" width="1.5" height="1.5"/>        <rect x="45.5" y="13.5" width="1.5" height="1.5"/><rect x="47"   y="13.5" width="1.5" height="1.5"/>
    <rect x="41"   y="15"   width="1.5" height="1.5"/>                           <rect x="44"   y="15"   width="1.5" height="1.5"/>                           <rect x="47"   y="15"   width="1.5" height="1.5"/>
    <rect x="41"   y="16.5" width="1.5" height="1.5"/>                                                          <rect x="47"   y="16.5" width="1.5" height="1.5"/>
    <rect x="41"   y="18"   width="1.5" height="1.5"/>                                                          <rect x="47"   y="18"   width="1.5" height="1.5"/>

    <!-- E  (startX=49.5) -->
    <rect x="49.5" y="12"   width="1.5" height="1.5"/><rect x="51"   y="12"   width="1.5" height="1.5"/><rect x="52.5" y="12"   width="1.5" height="1.5"/><rect x="54"   y="12"   width="1.5" height="1.5"/>
    <rect x="49.5" y="13.5" width="1.5" height="1.5"/>
    <rect x="49.5" y="15"   width="1.5" height="1.5"/><rect x="51"   y="15"   width="1.5" height="1.5"/><rect x="52.5" y="15"   width="1.5" height="1.5"/>
    <rect x="49.5" y="16.5" width="1.5" height="1.5"/>
    <rect x="49.5" y="18"   width="1.5" height="1.5"/><rect x="51"   y="18"   width="1.5" height="1.5"/><rect x="52.5" y="18"   width="1.5" height="1.5"/><rect x="54"   y="18"   width="1.5" height="1.5"/>

    <!-- R  (startX=56.5)
         ███
         █  █
         ███
         █ █
         █  █ -->
    <rect x="56.5" y="12"   width="1.5" height="1.5"/><rect x="58"   y="12"   width="1.5" height="1.5"/><rect x="59.5" y="12"   width="1.5" height="1.5"/>
    <rect x="56.5" y="13.5" width="1.5" height="1.5"/>                                                          <rect x="61"   y="13.5" width="1.5" height="1.5"/>
    <rect x="56.5" y="15"   width="1.5" height="1.5"/><rect x="58"   y="15"   width="1.5" height="1.5"/><rect x="59.5" y="15"   width="1.5" height="1.5"/>
    <rect x="56.5" y="16.5" width="1.5" height="1.5"/>                           <rect x="59.5" y="16.5" width="1.5" height="1.5"/>
    <rect x="56.5" y="18"   width="1.5" height="1.5"/>                                                          <rect x="61"   y="18"   width="1.5" height="1.5"/>

    <!-- A  (startX=63.5)
          ██
         █  █
         ████
         █  █
         █  █ -->
                            <rect x="65"   y="12"   width="1.5" height="1.5"/><rect x="66.5" y="12"   width="1.5" height="1.5"/>
    <rect x="63.5" y="13.5" width="1.5" height="1.5"/>                                                          <rect x="68"   y="13.5" width="1.5" height="1.5"/>
    <rect x="63.5" y="15"   width="1.5" height="1.5"/><rect x="65"   y="15"   width="1.5" height="1.5"/><rect x="66.5" y="15"   width="1.5" height="1.5"/><rect x="68"   y="15"   width="1.5" height="1.5"/>
    <rect x="63.5" y="16.5" width="1.5" height="1.5"/>                                                          <rect x="68"   y="16.5" width="1.5" height="1.5"/>
    <rect x="63.5" y="18"   width="1.5" height="1.5"/>                                                          <rect x="68"   y="18"   width="1.5" height="1.5"/>

    <!-- L  (startX=70.5)
         █
         █
         █
         █
         ████ -->
    <rect x="70.5" y="12"   width="1.5" height="1.5"/>
    <rect x="70.5" y="13.5" width="1.5" height="1.5"/>
    <rect x="70.5" y="15"   width="1.5" height="1.5"/>
    <rect x="70.5" y="16.5" width="1.5" height="1.5"/>
    <rect x="70.5" y="18"   width="1.5" height="1.5"/><rect x="72"   y="18"   width="1.5" height="1.5"/><rect x="73.5" y="18"   width="1.5" height="1.5"/><rect x="75"   y="18"   width="1.5" height="1.5"/>

    <!-- D  (startX=77.5)
         ███
         █  █
         █  █
         █  █
         ███  -->
    <rect x="77.5" y="12"   width="1.5" height="1.5"/><rect x="79"   y="12"   width="1.5" height="1.5"/><rect x="80.5" y="12"   width="1.5" height="1.5"/>
    <rect x="77.5" y="13.5" width="1.5" height="1.5"/>                                                          <rect x="82"   y="13.5" width="1.5" height="1.5"/>
    <rect x="77.5" y="15"   width="1.5" height="1.5"/>                                                          <rect x="82"   y="15"   width="1.5" height="1.5"/>
    <rect x="77.5" y="16.5" width="1.5" height="1.5"/>                                                          <rect x="82"   y="16.5" width="1.5" height="1.5"/>
    <rect x="77.5" y="18"   width="1.5" height="1.5"/><rect x="79"   y="18"   width="1.5" height="1.5"/><rect x="80.5" y="18"   width="1.5" height="1.5"/>

  </g>
</svg>
